controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0 
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # MPPI (Model Predictive Path Integral) 控制器
      # 基于采样的控制器，通过生成大量轨迹样本并评估代价函数来选择最优控制

      #*******************************************************************************
      # Motion Model 运动模型
      #*******************************************************************************
      motion_model: "Omni"                  # 运动模型类型："Omni"(全向)、"DiffDrive"(差速)、"Ackermann"(阿克曼)
      visualize: false                      # 是否在 RViz 中可视化采样轨迹（调试用，会增加计算负担）

      #*******************************************************************************
      # Trajectory Sampling 轨迹采样参数
      #*******************************************************************************
      time_steps: 100                       # 预测时域的步数，100步 × 0.05s = 5秒预测时域
      model_dt: 0.05                        # 每个时间步长（秒），应为 1/controller_frequency，即 1/20Hz = 0.05s
      batch_size: 1200                      # 每个周期采样的轨迹数量，越大越精确但计算量越大（1000-2000 推荐）
      iteration_count: 1                    # 每个控制周期的优化迭代次数（通常保持为 1）

      #*******************************************************************************
      # Velocity Limits 速度限制（全向移动机器人）
      #*******************************************************************************
      vx_max: 2.0                           # X 方向最大速度（m/s）
      vx_min: -2.0                          # X 方向最小速度（m/s），负值表示可后退
      vy_max: 2.0                           # Y 方向最大速度（m/s），全向移动机器人特有
      wz_max: 6.0                           # 最大角速度（rad/s），保持高速旋转能力以应对小陀螺场景

      #*******************************************************************************
      # Sampling Standard Deviations 采样标准差（探索噪声）
      #*******************************************************************************
      vx_std: 0.8                           # X 方向速度的采样标准差，控制前后方向的探索范围
      vy_std: 0.8                           # Y 方向速度的采样标准差，控制左右方向的探索范围
      wz_std: 2.0                           # 角速度的采样标准差，较大值以充分探索旋转空间

      #*******************************************************************************
      # Control Parameters 控制参数
      #*******************************************************************************
      temperature: 0.3                      # 温度参数：控制轨迹选择的贪婪程度。越低越贪婪（选最优），越高越平滑（考虑次优）
      gamma: 0.07                           # 折扣因子：平衡轨迹平滑度与能量消耗的权衡
      prune_distance: 2.0                   # 全局路径裁剪距离（米），只考虑机器人前方该距离内的全局路径
      transform_tolerance: 0.5              # TF 变换容差（秒），与 TEB 的 transform_tolerance 对应
      regenerate_noises: false              # 是否每个周期重新生成噪声（false 可提高一致性）
      retry_attempt_limit: 3                # 控制失败时的重试次数

      #*******************************************************************************
      # Critics 代价函数（用于评估轨迹质量）
      #*******************************************************************************
      critics: ["ObstaclesCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "TwirlingCritic"]
      # ObstaclesCritic: 障碍物避障代价
      # GoalCritic: 目标点吸引代价
      # PathAlignCritic: 路径对齐代价
      # PathFollowCritic: 路径跟随代价
      # TwirlingCritic: 防止过度旋转代价

      #*******************************************************************************
      # ObstaclesCritic - 障碍物避障代价函数
      #*******************************************************************************
      ObstaclesCritic:
        enabled: true                       # 启用障碍物避障代价
        cost_power: 1                       # 代价函数的幂次（1=线性，2=二次）
        repulsion_weight: 0.2               # 膨胀区域内的排斥力权重
        critical_weight: 20.0               # 接近碰撞时的高惩罚权重（对应 TEB 的 weight_obstacle）
        collision_cost: 40.0                # 碰撞的致命代价
        collision_margin_distance: 0.1      # 碰撞边界距离（米），机器人与障碍物的最小安全距离
        consider_footprint: false           # 是否考虑机器人足迹形状（true 会增加计算量，圆形机器人可设为 false）
        inflation_radius: 0.6               # 障碍物膨胀半径（米），应与 costmap 的 inflation_radius 一致
        cost_scaling_factor: 5.0            # 代价缩放因子，应与 costmap 的 cost_scaling_factor 一致

      #*******************************************************************************
      # GoalCritic - 目标点吸引代价函数
      #*******************************************************************************
      GoalCritic:
        enabled: true                       # 启用目标点吸引
        cost_power: 1                       # 代价函数的幂次
        cost_weight: 5.0                    # 目标吸引的权重
        threshold_to_consider: 1.0          # 激活目标吸引的距离阈值（米），距离目标小于此值时才考虑

      #*******************************************************************************
      # PathAlignCritic - 路径对齐代价函数
      #*******************************************************************************
      PathAlignCritic:
        enabled: true                       # 启用路径对齐
        cost_power: 1                       # 代价函数的幂次
        cost_weight: 20.0                   # 路径对齐的权重（对应 TEB 的 weight_viapoint）
        threshold_to_consider: 1.0          # 考虑路径对齐的距离阈值
        offset_from_furthest: 2             # 从最远点的偏移量
        use_path_orientations: false        # 是否使用路径的朝向信息（全向机器人设为 false）

      #*******************************************************************************
      # PathFollowCritic - 路径跟随代价函数
      #*******************************************************************************
      PathFollowCritic:
        enabled: true                       # 启用路径跟随
        cost_power: 1                       # 代价函数的幂次
        cost_weight: 5.0                    # 路径跟随的权重
        offset_from_furthest: 10            # 从最远点的偏移量
        threshold_to_consider: 1.0          # 考虑路径跟随的距离阈值

      #*******************************************************************************
      # TwirlingCritic - 防止过度旋转代价函数
      #*******************************************************************************
      TwirlingCritic:
        enabled: true                       # 启用防止过度旋转
        twirling_cost_power: 1              # 旋转代价的幂次
        twirling_cost_weight: 10.0          # 旋转惩罚权重，防止机器人不必要的旋转

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link_fake
      use_sim_time: False
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.02
      robot_radius: 0.27
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          raytrace_max_range: 6.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.1
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.5
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link_fake
      use_sim_time: False
      robot_radius: 0.27
      resolution: 0.04
      track_unknown_space: true
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        # https://github.com/SteveMacenski/spatio_temporal_voxel_layer
        enabled:                  true
        voxel_decay:              0.5                               # 如果是线性衰减，单位为秒；如果是指数衰减，则为 e 的 n 次方
        decay_model:              0                                 # 衰减模型，0=线性，1=指数，-1=持久
        voxel_size:               0.05                              # 每个体素的尺寸，单位为米
        track_unknown_space:      true                              # default space is unknown
        mark_threshold:           0                                 # voxel height
        update_footprint_enabled: true
        combination_method:       1                                 # 1=max, 0=override
        origin_z:                 0.0                               # 单位为米
        publish_voxel_map:        true                              # default false, 是否发布体素地图
        transform_tolerance:      0.2                               # 单位为秒
        mapping_mode:             false                             # default off, saves map not for navigation
        map_save_duration:        60.0                              # default 60s, how often to autosave
        observation_sources:      livox_mark livox_clear
        livox_mark:
          data_type: PointCloud2
          topic: /segmentation/obstacle
          marking: true
          clearing: false
          obstacle_range: 3.0                                       # meters
          min_obstacle_height: 0.2                                  # default 0, meters
          max_obstacle_height: 2.0                                  # default 3, meters
          expected_update_rate: 0.0                                 # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0                              # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false                                       # default false, for laser scans
          filter: "voxel"                                           # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on
          voxel_min_points: 0                                       # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true                                 # default false, clear the buffer after the layer gets readings from it
        livox_clear:
          enabled: true                                             # default true, can be toggled on/off with associated service call
          data_type: PointCloud2
          topic: /segmentation/obstacle
          marking: false
          clearing: true
          max_z: 8.0                                                # default 10, meters
          min_z: 1.0                                                # default 0, meters
          vertical_fov_angle: 1.029                                 # 垂直视场角，单位为弧度，For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_padding: 0.05                                # 3D Lidar only. Default 0, in meters
          horizontal_fov_angle: 6.29                                # 3D 激光雷达水平视场角
          decay_acceleration: 5.0                                   # default 0, 1/s^2.
          model_type: 1                                             # 0=深度相机，1=3D激光雷达
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        footprint_clearing_enabled: True
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.7
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 2.0
    recovery_plugins: ["spin","backup"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    global_frame: odom
    robot_base_frame: base_link_fake
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 1.0
    max_rotational_vel: 3.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 2.0, 3.0]
    min_velocity: [-2.0, -2.0, -3.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [2.0, 2.0, 6.0]
    max_decel: [-2.0, -2.0, -6.0]
    odom_topic: "Odometry"
    odom_duration: 0.1